# Shared Context bundle: one Host row that serves the same-origin proxy and the
# browser panel. The Host plugin injects `webServer`; the browser half is
# discovered from this package's `dsh.client` manifest.
- insert:
    - id: shared-context
      name: dsh-plugin-shared-context
      config:
        # `auto` resolves per activation: SHARED_CONTEXT_URL, then this row's
        # explicit origin, then SHARED_CONTEXT_CONFIG, then
        # $DSH_HOME/shared-context/config.json, then the legacy global 4319
        # config. A loopback origin here pins the daemon.
        baseUrl: auto
